# Template for infra/k8s/secret.yaml, which is gitignored because it holds real
# credentials. Copy this file, fill in the values, and never commit the copy:
#
#   cp infra/k8s/secret.example.yaml infra/k8s/secret.yaml
#
# A Kubernetes Secret is only base64 encoded, not encrypted. Anyone who can read
# the file or run `kubectl get secret -o yaml` can read every value in it. For
# production, keep the values in AWS Secrets Manager and pull them into the
# cluster with the External Secrets Operator, so nothing sensitive sits in git.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  GITHUB_WEBHOOK_SECRET: ""      # From the GitHub App settings. The gateway checks every webhook against this.
  GITHUB_APP_ID: ""              # The numeric App ID. Goes inside the signed token.
  GITHUB_APP_PRIVATE_KEY: |      # Paste the full .pem downloaded from the GitHub App here,
    REPLACE_ME                   # every line indented to this depth, BEGIN and END lines included.
  OPENAI_API_KEY: ""             # Used by the four review agents in the orchestrator.
  LANGFUSE_PUBLIC_KEY: ""        # Langfuse traces every model call so cost and prompts are visible.
  LANGFUSE_SECRET_KEY: ""        # The other half of the Langfuse pair.
  DATABASE_URL: ""               # postgresql+asyncpg://USER:PASSWORD@HOST:5432/codereviewer
